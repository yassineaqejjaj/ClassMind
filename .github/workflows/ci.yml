name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package and test requirements
        run: |
          python -m pip install --upgrade pip
          # The API is a source tree, not an installable distribution yet.
          # Read declared runtime requirements without invoking a package build.
          python -m pip install pytest pytest-asyncio ruff
          python -c 'import sys,tomllib,subprocess; deps=tomllib.load(open("apps/api/pyproject.toml","rb"))["project"]["dependencies"]; subprocess.check_call([sys.executable,"-m","pip","install",*deps])'
      - name: Run API and shared tests
        working-directory: apps/api
        run: python -m pytest -q tests ../../tests

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
