[project]
name = "classmind-api"
version = "0.1.0"
description = "ClassMind API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "openai>=1.50",
  "sympy>=1.13",
  "pandas>=2.2",
  "jinja2>=3.1",
  "weasyprint>=62",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests", "../../tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
